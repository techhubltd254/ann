name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rsync code to VPS
        uses: burnett01/rsync-deployments@7.0.0
        with:
          switches: -avz --delete
          path: ./
          remote_path: /opt/kicc-laravel
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
          remote_key_pass: ""
          exclude: |
            .git/
            .env*
            storage/
            vendor/
            node_modules/
            muranga video.mp4
            muranga hero.mp4
            Mombasa_*.pdf
            Mombasa_*.csv
            public/3d/*.mp4
            public/resort_4d_quality.mp4
            public/hls/
            kicc building/
            kicc-video/
            hero_build/
            kicc-one/
            kenya-3d-platform/
            *.tar.gz
            *.zip

      - name: Post-deploy (deps, migrate, caches, restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kicc-laravel
            if [ -f composer.json ]; then
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader 2>&1 | tail -3
            fi
            php artisan migrate --force 2>&1 | tail -3 || true
            php artisan config:clear 2>&1 | tail -1
            php artisan cache:clear 2>&1 | tail -1
            php artisan view:clear 2>&1 | tail -1
            php artisan route:clear 2>&1 | tail -1 || true
            systemctl restart php8.4-fpm
            echo "DEPLOY COMPLETE: $(date)"