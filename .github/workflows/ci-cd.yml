name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    name: PHP lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, redis
          coverage: none
      - name: Validate composer
        run: composer validate --no-check-publish
      - name: Prepare env
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never
      - name: PHP syntax check
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null || exit 1; done

  node-build:
    name: Admin web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install + build admin-web
        working-directory: admin-web
        run: |
          npm ci
          npm run build

  engine-tests:
    name: Engine tests (gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Run engine tests
        working-directory: engine
        run: ./gradlew test --no-daemon

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - name: Composer audit
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --format=plain || true
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: npm audit
        working-directory: admin-web
        run: npm audit --audit-level=high || true
