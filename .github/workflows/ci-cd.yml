name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

env:
  APP_DIR: /opt/kicc-laravel

jobs:
  php-tests:
    name: PHP lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, ctype, json, redis
          coverage: none
      - name: Validate composer
        run: composer validate --no-check-publish
      - name: Prepare env
        run: cp .env.example .env
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=never
      - name: PHP syntax check
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null || exit 1; done

  node-build:
    name: Admin web build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install + build admin-web
        working-directory: admin-web
        run: |
          npm ci
          npm run build

  engine-tests:
    name: Engine tests (gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Run engine tests
        working-directory: engine
        run: gradle test --no-daemon

  security:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4' }
      - name: Composer audit
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --format=plain || true
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: npm audit
        working-directory: admin-web
        run: npm audit --audit-level=high || true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [php-tests, engine-tests, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORIGIN_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.ORIGIN_HOST }} >> ~/.ssh/known_hosts
      - name: Sync files via rsync
        run: |
          rsync -avz --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'vendor' \
            --exclude 'storage/oauth-*.key' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ORIGIN_USER }}@${{ secrets.ORIGIN_HOST }}:${{ env.APP_DIR }}/
      - name: Run deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORIGIN_HOST }}
          username: ${{ secrets.ORIGIN_USER }}
          key: ${{ secrets.ORIGIN_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying ${{ github.sha }} ==="

            cd ${{ env.APP_DIR }}

            # Install PHP dependencies
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-interaction --no-dev --prefer-dist

            # Run idempotent migrations
            php artisan migrate --force

            # Clear caches
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear

            # Restart services
            systemctl restart php8.4-fpm
            systemctl restart kicc-pulse || true

            echo "=== Deploy complete ==="