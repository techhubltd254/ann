upstream php {
    server unix:/var/run/php/php8.4-fpm.sock;
}

server {
    listen 80;
    server_name kicctest.org www.kicctest.org origin.kicctest.org;
    
}

server {
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    server_name kicctest.org www.kicctest.org origin.kicctest.org;

    root /opt/kicc-laravel/public;
    index index.php;

    location /assets/ {
        alias /opt/kicc/web/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log /var/log/nginx/access.log;
    }

    location /api/engine/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
        proxy_buffering off;
    }

    location /admin {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /3d/ {
        try_files $uri $uri/ =404;
        add_header Access-Control-Allow-Origin "*";
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8091;
        deny all;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ /\. {
        deny all;
        access_log /var/log/nginx/access.log;
        log_not_found off;
    }

    location ~* \.(jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log /var/log/nginx/access.log;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
