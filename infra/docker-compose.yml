# KICC ONE — local orchestration (dev/stage parity; 12-factor via .env)
# Services: platform (Laravel), engine (Kotlin), mysql8 (TiDB-compatible), redis, minio (R2 S3-compat), mailpit
name: kicc-one

services:
  platform:
    build:
      context: ../platform
      dockerfile: ../infra/Dockerfile.platform
    env_file: .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: kicc
      DB_USERNAME: kicc
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_BUCKET: kicc-media
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    ports: ["8080:80"]
    depends_on:
      mysql: { condition: service_healthy }
      redis:  { condition: service_started }
      minio:  { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  engine:
    build:
      context: ..
      dockerfile: infra/Dockerfile.engine
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KICC_DB_URL: jdbc:mysql://mysql:3306/kicc?useSSL=false&serverTimezone=UTC
      KICC_DB_USER: kicc
      KICC_DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      KICC_REDIS_HOST: redis
      KICC_MEDIA_S3_ENDPOINT: http://minio:9000
      KICC_MEDIA_BUCKET: kicc-media
      KICC_UPDATE_MANIFEST_URL: https://kicctest.org/api/updates/manifest
    ports: ["8091:8091"]
    depends_on:
      mysql: { condition: service_healthy }
      redis:  { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    command: --default-authentication-plugin=caching_sha2_password --max-connections=200
    environment:
      MYSQL_DATABASE: kicc
      MYSQL_USER: kicc
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  transcode-worker:
    image: jrottenberg/ffmpeg:7-alpine
    profiles: ["workers"]
    entrypoint: ["tail", "-f", "/dev/null"]  # replaced by pipeline/transcode_worker.py in prod image
    depends_on: [redis, minio]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

volumes:
  mysql-data:
  redis-data:
  minio-data:
