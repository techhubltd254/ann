# KICC CDN — Self-hosted Edge PoP Node (Nginx)
# Drop this on any VPS in a target region (US East, EU Frankfurt,
# Africa Cape Town, Asia Singapore) to serve as a custom edge cache.
#
# Requires: nginx-full (slice module), certbot, NVMe or SSD storage.
# Deploy: infra/cdn/deploy-edge-node.sh
#
# Tier: this node sits BETWEEN Cloudflare (330+ PoPs) and your origin
# droplet. It absorbs repeat requests for the same assets via proxy_cache,
# reducing origin load. Cloudflare's Anycast routes clients to the nearest
# node, and this Nginx node serves cached content from local NVMe.

proxy_cache_path /var/cache/nginx/cdn
    levels=1:2
    keys_zone=CDN_CACHE:200m      # 200 MB of cache keys in RAM
    max_size=100g                  # 100 GB on NVMe/SSD
    inactive=30d                   # evict after 30 days unused
    use_temp_path=off;

# Rate limiting — 100 req/s per IP with burst tolerance
limit_req_zone $binary_remote_addr zone=cdn_limit:20m rate=100r/s;

upstream origin {
    # Primary origin (your Laravel droplet)
    server origin.kicctest.org:443 weight=1 max_fails=3 fail_timeout=10s;
    # Fallback: R2 direct (serves static/cached media when origin is down)
    server kicc-r2-media.techhubltd254.workers.dev:443 weight=1 max_fails=3 fail_timeout=10s backup;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.yourdomain.com;  # replace with your CDN hostname

    # ---- TLS (managed by certbot) ----
    ssl_certificate     /etc/letsencrypt/live/cdn.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- Global config ----
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_max_temp_file_size 0;   # stream to client, don't buffer large files to disk again

    # ---- Rate limiting & bot mitigation ----
    limit_req zone=cdn_limit burst=200 nodelay;

    # ---- Request logging (minimal) ----
    access_log /var/log/nginx/cdn_access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/cdn_error.log warn;

    location / {
        proxy_pass https://origin;
        proxy_http_version 1.1;
        proxy_set_header Host origin.kicctest.org;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # ---- Cache activation ----
        proxy_cache CDN_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 206 30d;    # success responses cached 30 days
        proxy_cache_valid 404 1m;          # 404s cached 1 minute
        proxy_cache_bypass $http_cache_control;  # bypass if client sends no-cache
        proxy_no_cache $http_cache_control;

        # ---- Thundering herd / cache stampede prevention ----
        # When an item is stale/expired, ONLY ONE request goes to origin.
        # Other concurrent requests wait up to 5s for the first to complete.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # ---- Serve stale content on origin error ----
        proxy_cache_use_stale error timeout updating
            http_500 http_502 http_503 http_504;

        # ---- Slice large files for streaming cache efficiency ----
        # Splits responses into 1 MB slices — each slice is cached
        # independently, so a 4 GB video only needs one 1 MB chunk
        # fetched from origin to serve the first seek.
        slice 1m;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 206 30d;

        # ---- Telemetry headers ----
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-CDN-Node $hostname always;
        add_header Access-Control-Allow-Origin * always;
    }

    # ---- Media derivatives — immutable, no origin fallback needed ----
    location /media/derivatives/ {
        proxy_pass https://origin;
        proxy_http_version 1.1;
        proxy_set_header Host origin.kicctest.org;
        proxy_set_header Connection "";

        proxy_cache CDN_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;    # derivatives are immutable — cache 1 year
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_revalidate on;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Static assets — 1 year immutable ----
    location ~ ^/(build|assets|js|css|fonts|images)/ {
        proxy_pass https://origin;
        proxy_http_version 1.1;
        proxy_set_header Host origin.kicctest.org;
        proxy_set_header Connection "";

        proxy_cache CDN_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;

        add_header X-Cache-Status $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Health check for load balancer ----
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }
}