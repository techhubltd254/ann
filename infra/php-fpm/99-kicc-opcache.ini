; KICC PHP OPcache tuning for production.
; Drop-in for /etc/php/8.4/fpm/conf.d/99-kicc-opcache.ini
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
; Disabled timestamp validation in production: config + routes are cached,
; deploys must run `php artisan opcache:reset` or restart fpm to invalidate.
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
opcache.jit_buffer_size = 64M
opcache.jit = tracing