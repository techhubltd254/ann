; KICC PHP-FPM tuning for 2-vCPU production droplet.
; Drop-in for /etc/php/8.4/fpm/pool.d/www.conf
; Key insight: on 2 vCPUs, 40 children cause context-switch thrash.
; CPU-bound Laravel rendering wants ~1.5-2x cores; DB waits want headroom.
; 16 children balances throughput vs latency at this size.

[www]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; TiDB (remote) — keep connections alive, avoid TLS re-handshakes per request
; Laravel's pdo_mysql keeps the pool; do not add persistent here to avoid
; TiDB serverless connection limits. FPM reuses processes instead.

request_terminate_timeout = 60
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-slow.log

catch_workers_output = no
decorate_workers_output = no