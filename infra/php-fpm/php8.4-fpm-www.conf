; KICC PHP-FPM tuning for the 2-vCPU / 4GB production droplet.
; Drop-in for /etc/php/8.4/fpm/pool.d/www.conf
; Values match what is live in production (verified 2026-08).
; 40 children are used in production: the public path is edge-cached
; (stateless + Cloudflare), so most PHP hits are uncacheable API/auth
; requests that block on remote TiDB, where spare workers buy headroom.

[www]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 40
pm.start_servers = 16
pm.min_spare_servers = 2
pm.max_spare_servers = 32
pm.max_requests = 1000

; TiDB (remote) — keep connections alive, avoid TLS re-handshakes per request
; Laravel's pdo_mysql keeps the pool; do not add persistent here to avoid
; TiDB serverless connection limits. FPM reuses processes instead.

request_terminate_timeout = 60
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-slow.log

catch_workers_output = no
decorate_workers_output = no