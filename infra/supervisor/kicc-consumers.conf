; KICC inter-pipeline bus consumers.
; One process per consumer group so a crash in kicc_algorithms cannot stall ml-engine.
; Install:  sudo cp infra/supervisor/kicc-consumers.conf /etc/supervisor/conf.d/
;           sudo supervisorctl reread && sudo supervisorctl update
[program:kicc-algorithms-consumer]
command=node /srv/kicc/integrations-service/consumers/run_consumers.mjs --only=kicc-algorithms
directory=/srv/kicc/integrations-service
environment=MOCK_MODE="false",KICC_ALGORITHMS_URL="http://127.0.0.1:8801/algorithms/score",CONSUMER_STATUS_PORT="8791",PIPELINE_BUS_JOURNAL="/srv/kicc/integrations-service/run/artifacts/bus.jsonl"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/kicc/algorithms-consumer.log
redirect_stderr=true

[program:ml-engine-consumer]
command=node /srv/kicc/integrations-service/consumers/run_consumers.mjs --only=ml-engine
directory=/srv/kicc/integrations-service
environment=MOCK_MODE="false",ML_ENGINE_URL="http://127.0.0.1:8802/predict",CONSUMER_STATUS_PORT="8792",PIPELINE_BUS_JOURNAL="/srv/kicc/integrations-service/run/artifacts/bus.jsonl"
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/var/log/kicc/ml-engine-consumer.log
redirect_stderr=true
