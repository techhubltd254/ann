upstream php { server unix:/var/run/php/php8.4-fpm.sock; }
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/origin.kicctest.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.kicctest.org/privkey.pem;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    client_max_body_size 1G;
    server_name kicctest.org www.kicctest.org origin.kicctest.org localhost;
    root /opt/kicc-laravel/public;
    index index.php;
    # Exact, unchanged approved KICC HTML interface; legacy application remains available.
    location = / {
        try_files /KICC-EXPERIENCE-BUILD.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-KICC-Interface "KICC-EXPERIENCE-BUILD" always;
        add_header Set-Cookie "kicc_ui_live=production; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /KICC-EXPERIENCE-BUILD.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-KICC-Interface "KICC-EXPERIENCE-BUILD" always;
        add_header Set-Cookie "kicc_ui_live=production; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }


    location /healthz { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location /droplet { access_log off; default_type text/plain; return 200 "web-1\n"; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/var/run/php/php8.4-fpm.sock; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\. { deny all; }
    location ~* \.(jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; access_log off; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/origin.kicctest.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.kicctest.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 1G;
    server_name kicctest.org www.kicctest.org origin.kicctest.org;
    root /opt/kicc-laravel/public;
    index index.php;
    # Exact, unchanged approved KICC HTML interface; legacy application remains available.
    location = / {
        try_files /KICC-EXPERIENCE-BUILD.html =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-KICC-Interface "KICC-EXPERIENCE-BUILD" always;
        add_header Set-Cookie "kicc_ui_live=production; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /KICC-EXPERIENCE-BUILD.html {
        try_files $uri =404;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header X-KICC-Interface "KICC-EXPERIENCE-BUILD" always;
        add_header Set-Cookie "kicc_ui_live=production; Path=/; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }


    location /healthz { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    location /droplet { access_log off; default_type text/plain; return 200 "web-1\n"; }
    location /api/engine/ { proxy_pass http://127.0.0.1:8091/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 90; proxy_buffering off; }
    location /admin { proxy_pass http://127.0.0.1:8091/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { include snippets/fastcgi-php.conf; fastcgi_pass unix:/var/run/php/php8.4-fpm.sock; }
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\. { deny all; }
    location ~* \.(jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; access_log off; }
}
