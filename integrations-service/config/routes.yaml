# =============================================================================
# Routing. Which provider serves which lane / payment method.
# Order = priority. First enabled provider wins; the rest are failover.
# =============================================================================

payments:
  # buyer selects "M-Pesa" in checkout
  mobile_money:
    KE: [mpesa, flutterwave, pesapal]
    UG: [pesapal, flutterwave]
    TZ: [pesapal, flutterwave]
    RW: [pesapal, flutterwave]
    default: [flutterwave, stripe]
  # buyer selects "Card"
  card:
    KE: [flutterwave, pesapal, paystack, stripe]
    default: [stripe, flutterwave, paystack]
  # buyer selects "Bank transfer / escrow"
  bank:
    default: [bank, paystack]

freight:
  # lane id (matches store/config.js ZONES) -> carrier priority
  ke-nairobi:   [sendy, dhl, posta]
  ke-upcountry: [sendy, posta, dhl]
  ke-remote:    [posta, sendy]
  ea:           [dhl, aramex, fedex]
  af:           [dhl, aramex]
  eu-uk:        [dhl, fedex, aramex]
  mena-asia:    [dhl, aramex, fedex]
  americas:     [fedex, dhl]
  # sea lane (heavy cargo: minerals, tea, coffee in bulk, machinery)
  sea:          [ocean, dhl]

# Goods that must never travel without cold chain or special handling.
special_handling:
  cold_chain_pipelines: [5, 6, 7, 8, 9, 10, 12, 13, 57]
  licensed_export_pipelines: [1, 2, 7, 8, 14, 15, 18, 19, 56]
  high_value_pipelines: [18, 19, 85, 86, 87]

