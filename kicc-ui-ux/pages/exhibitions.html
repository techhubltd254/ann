<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KICC — Exhibitions</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#0A1024;color:#fff;padding:40px}
.wrap{max-width:1200px;margin:auto}.card{background:#1B1E3F;border:1px solid #5A648030;border-radius:18px;padding:20px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}.fade{color:#5A6480;font-size:13px}</style>
<h1 style="font-size:28px;font-weight:800;color:#FFCD05">🎪 Exhibitions & Events</h1><p class=fade style=margin-bottom:20px>Trade shows, cultural festivals, and business exhibitions across Kenya</p>
<div class=grid><script>
const e=[{n:"Kenya International Trade Fair",d:"3 days",l:"KICC Nairobi",s:"Mar 15-17, 2027",t:"Trade, Agriculture, Manufacturing",c:"#901C1E"},{n:"Mombasa Tourism Expo",d:"2 days",l:"Mombasa Convention",s:"Apr 5-6, 2027",t:"Tourism, Hospitality, Transport",c:"#1890D7"},{n:"Murang'a Tea Festival",d:"Weekend",l:"Murang'a Highlands",s:"May 20-22, 2027",t:"Agriculture, Tea, Culture",c:"#11820B"},{n:"Kajiado Investment Summit",d:"2 days",l:"Kajiado Business Park",s:"Jun 10-11, 2027",t:"Investment, Mining, Energy",c:"#FFCD05"},{n:"Kilifi Marine Expo",d:"3 days",l:"Kilifi Resort",s:"Jul 14-16, 2027",t:"Fisheries, Marine, Tourism",c:"#1890D7"},{n:"Nairobi Tech Week",d:"5 days",l:"KICC Nairobi",s:"Aug 2-6, 2027",t:"Technology, Innovation, Startups",c:"#901C1E"}];
for(let i=0;i<6;i++){const x=e[i];document.write('<div class=card><div style="height:140px;background:linear-gradient(135deg,'+x.c+'40,#1B1E3F);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:12px">🎪</div><h3 style=font-size:18px;font-weight:700>'+x.n+'</h3><p class=fade style=margin-top:6px>'+x.l+'<br>'+x.d+' · '+x.s+'</p><div style=margin-top:8px;display:flex;gap:4px;flex-wrap:wrap>'+x.t.split(",").map(t=>'<span style="background:'+x.c+'30;color:#fff;padding:4px 8px;border-radius:6px;font-size:11px">'+t+'</span>').join("")+'</div><button style="margin-top:10px;padding:10px 24px;background:#901C1E;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600">Register Interest →</button></div>');}
</script></div>
</body></html>
