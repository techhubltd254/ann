<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KICC — Register</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#0A1024;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1B1E3F;border-radius:24px;padding:40px;width:520px;max-width:100%}.fade{color:#5A6480;font-size:13px}</style>
<div class="card"><h2 style="font-size:28px;font-weight:800;color:#FFCD05;margin-bottom:4px">Create Your Account</h2>
<p class="fade" style="margin-bottom:24px">Join the KICC platform as an exhibitor, buyer, or partner.</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<input placeholder="First Name" style="padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
<input placeholder="Last Name" style="padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
<input placeholder="Email" style="grid-column:span 2;padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
<input placeholder="Phone Number" style="padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
<select style="padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#B0B0C0"><option>Account Type</option><option>Exhibitor</option><option>Buyer</option><option>Partner</option></select>
<input type="password" placeholder="Password" style="padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
<input type="password" placeholder="Confirm Password" style="grid-column:span 2;padding:14px;border-radius:10px;background:#0A1024;border:1px solid #5A6480;color:#fff;outline:none">
</div>
<label style="display:flex;align-items:center;gap:8px;margin:16px 0;color:#888;font-size:13px"><input type="checkbox" style="width:18px;height:18px">I agree to the Terms of Service</label>
<button style="width:100%;padding:16px;background:linear-gradient(135deg,#FFCD05,#E6B800);color:#0B1E57;border:none;border-radius:12px;font-size:16px;font-weight:800">Create Account →</button>
<p class="fade" style="text-align:center;margin-top:12px">Already have an account? <a style="color:#1890D7">Sign In</a></p>
</div></body></html>
