<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KICC — All Counties</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#0A1024;color:#fff;padding:40px}
.wrap{max-width:1200px;margin:auto}
.card{background:#1B1E3F;border:1px solid #5A648030;border-radius:20px;padding:24px;overflow:hidden;transition:all .2s}
.card:hover{transform:translateY(-4px);border-color:#5A648060}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.search{width:100%;padding:14px 18px;border-radius:14px;background:#0A1024;border:1px solid #5A6480;color:#fff;font-size:15px;outline:none}
.fade{color:#5A6480;font-size:13px}
.badge{background:#901C1E;color:#fff;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
</style>
<nav style="display:flex;align-items:center;gap:24px;padding:12px 0;margin-bottom:24px">
<h1 style="font-size:28px;font-weight:800;color:#FFCD05">🇰🇪 All 47 Counties</h1>
<div style="flex:1"></div>
<input class="search" placeholder="Search counties..." style="max-width:320px;margin-left:auto">
</nav>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
<span class="badge" style="background:#FFCD05;color:#0B1E57">All</span><span class="badge">Tourism</span><span class="badge">Agriculture</span><span class="badge">Investment</span><span class="badge">Coastal</span><span class="badge">Highland</span><span class="badge">Rift Valley</span>
</div>
<div class="grid">
<script>const c=["Murang'a","Mombasa","Kajiado","Kilifi","Nairobi City","Nakuru","Kisumu","Eldoret","Nyeri","Embu","Meru","Machakos","Thika","Malindi","Lamu","Voi","Wajir","Mandera","Garissa","Isiolo","Marsabit","Moyale","Lodwar","Kitale","Busia","Siaya","Kisii","Migori","Homa Bay","Kericho","Bomet","Narok","Kajiado","Kitui","Mwingi","Chuka","Maralal","Rumuruti","Nanyuki","Timau","Nuno","Kangari","Murang'a South","Kangari North","Taita","Taveta","Kwale"];
for(let i=0;i<47;i++)document.write('<div class=card><div style="height:120px;background:linear-gradient(135deg,#1B1E3F,'+(i%2==0?'#901C1E30':'#1890D730')+');border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:32px">'+['🏔️','🏖️','🌋','🏕️','🏙️','🌊','🏞️','🌄','🌲','🏜️'][i%10]+'</div><h3 style=font-size:18px;font-weight:700>'+c[i]+'</h3><p class=fade style=margin-top:8px>'+(i==0?'Tea highlands, waterfalls, Sagana rafting':i==1?'Coastal beaches, Fort Jesus':i==2?'Rift Valley, volcanic landscapes':'Explore this county')+'</p><div style=margin-top:12px;display:flex;gap:8px><span class=badge>Products</span><span class=badge>Tourism</span></div><a style=color:#1890D7;font-size:13px;font-weight:600;margin-top:12px;display:inline-block>View County →</a></div>');
</script></div>
<div style="text-align:center;margin-top:32px"><a href=# style="background:#901C1E;color:#fff;padding:14px 36px;border-radius:12px;font-weight:700;font-size:15px">Load More</a></div>
</body></html>
