<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KICC — Trade Agreements</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}body{background:#0A1024;color:#fff;padding:40px}
.wrap{max-width:1200px;margin:auto}.card{background:#1B1E3F;border:1px solid #5A648030;border-radius:18px;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}.fade{color:#5A6480;font-size:13px}</style>
<h1 style="font-size:28px;font-weight:800;color:#FFCD05">📋 Trade Agreements</h1><p class=fade style=margin-bottom:20px>Cross-border trade blocs and international partnerships</p>
<div class=grid><script>
const t=[{n:"EAC Common Market",m:"7 members",desc:"East African Community — free trade across Kenya, Tanzania, Uganda, Rwanda, Burundi, South Sudan, DRC",p:"Trade→A4, Export→B3",c:"#901C1E"},{n:"AfCFTA",m:"54 members",desc:"African Continental Free Trade Area — single market for Africa's 1.4B people",p:"Trade→A4, Export→B3",c:"#FFCD05"},{n:"COMESA",m:"21 members",desc:"Common Market for Eastern and Southern Africa",p:"Trade→A4, Investment→D1",c:"#1890D7"},{n:"UK-EPA",m:"2 parties",desc:"Economic Partnership Agreement with the United Kingdom",p:"Export→B3, Agri→B1",c:"#11820B"}];
for(let i=0;i<4;i++){const x=t[i];document.write('<div class=card><h3 style=font-size:20px;font-weight:700>'+x.n+'</h3><p class=fade style=margin-top:6px>'+x.desc+'</p><div style=display:flex;gap:6px;margin-top:8px>'+x.p.split(",").map(p=>'<span style=background:'+x.c+'30;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px>'+p+'</span>').join("")+'</div><p style=color:#5A6480;font-size:12px;margin-top:8px>'+x.m+'</p></div>');}
</script></div>
</body></html>
