spring:
  datasource:
    url: jdbc:mysql://gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/kicc?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: PLACEHOLDER
    password: PLACEHOLDER
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
    open-in-view: false

kicc:
  cors-origins: https://kicc.co.ke,http://localhost:5173,http://localhost:8091
  cookie-secure: true
  jwt:
    secret: ${JWT_SECRET:kicc-production-jwt-secret-change-me-2026}
    access-ttl: 900
    refresh-ttl: 604800
  web-dir: ./web
  source-db: ""
  payments:
    revenue-share-kicc: 0.8
    revenue-share-county: 0.2

server:
  port: ${PORT:8091}
  forward-headers-strategy: framework
