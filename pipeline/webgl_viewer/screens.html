<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KICC Screen Videos — Directory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a12; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 40px 20px; min-height: 100vh;
  }
  h1 { font-size: 24px; color: #FFD700; margin-bottom: 4px; }
  .subtitle { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 32px; }
  .back { color: rgba(255,255,255,0.4); font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
  .back:hover { color: #FFD700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 16px; transition: background 0.2s;
  }
  .card:hover { background: rgba(255,255,255,0.08); }
  .card h3 { font-size: 15px; margin-bottom: 2px; }
  .card .screen-id { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 8px; font-family: monospace; }
  .card .meta { font-size: 12px; color: rgba(255,255,255,0.5); display: flex; gap: 12px; }
  .card .meta span { display: flex; align-items: center; gap: 4px; }
  .card .play-btn {
    display: inline-block; margin-top: 10px;
    background: rgba(255,215,0,0.15); color: #FFD700;
    padding: 6px 16px; border-radius: 8px; font-size: 12px; text-decoration: none;
    transition: background 0.2s;
  }
  .card .play-btn:hover { background: rgba(255,215,0,0.25); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 6px; vertical-align: middle; }
  .tag-county { background: rgba(68,136,255,0.2); color: #88bbff; }
  .tag-sector { background: rgba(68,170,68,0.2); color: #88cc88; }
  .tag-hero { background: rgba(255,215,0,0.2); color: #FFD700; }
  .tag-hallway { background: rgba(136,68,255,0.2); color: #bb88ff; }
  .footer { margin-top: 40px; font-size: 12px; color: rgba(255,255,255,0.2); text-align: center; }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
  <a class="back" href="index.html">← Back to Main</a>
  <h1>🎬 Exhibition Screen Videos</h1>
  <p class="subtitle">18 auto-generated showcase videos for every screen in the KICC National Exhibition</p>
  <div class="grid" id="video-grid"></div>
  <div class="footer">KICC National Exhibition Platform · Generated via ffmpeg + Pillow</div>
  <script>
    const screens = [
      { id: 'county_main_14', label: 'Mombasa Main Booth', dur: 108, size: 294, imgs: 15, type: 'county' },
      { id: 'county_main_15', label: 'Kilifi Main Booth', dur: 115, size: 147, imgs: 16, type: 'county' },
      { id: 'county_sub_14', label: 'Mombasa Sub-Booth', dur: 90, size: 135, imgs: 15, type: 'county' },
      { id: 'county_sub_15', label: 'Kilifi Sub-Booth', dur: 90, size: 119, imgs: 16, type: 'county' },
      { id: 'sector_tourism', label: 'Tourism Pavilion', dur: 45, size: 165, imgs: 15, type: 'sector' },
      { id: 'sector_culture', label: 'Culture Pavilion', dur: 45, size: 82, imgs: 47, type: 'sector' },
      { id: 'sector_agriculture', label: 'Agriculture Pavilion', dur: 45, size: 53, imgs: 6, type: 'sector' },
      { id: 'sector_transport', label: 'Transport Pavilion', dur: 45, size: 53, imgs: 6, type: 'sector' },
      { id: 'sector_trade', label: 'Trade Pavilion', dur: 45, size: 51, imgs: 6, type: 'sector' },
      { id: 'sector_fisheries', label: 'Fisheries Pavilion', dur: 45, size: 39, imgs: 5, type: 'sector' },
      { id: 'sector_environment', label: 'Environment Pavilion', dur: 45, size: 37, imgs: 5, type: 'sector' },
      { id: 'sector_education', label: 'Education Pavilion', dur: 45, size: 17, imgs: 2, type: 'sector' },
      { id: 'sector_health', label: 'Health Pavilion', dur: 45, size: 16, imgs: 1, type: 'sector' },
      { id: 'sector_energy', label: 'Energy Pavilion', dur: 45, size: 16, imgs: 2, type: 'sector' },
      { id: 'sector_manufacturing', label: 'Manufacturing Pavilion', dur: 45, size: 13, imgs: 2, type: 'sector' },
      { id: 'hero_entrance', label: 'Hero Entrance Wall', dur: 90, size: 187, imgs: 75, type: 'hero' },
      { id: 'hallway_east', label: 'East Hallway Display', dur: 150, size: 551, imgs: 75, type: 'hallway' },
      { id: 'hallway_west', label: 'West Hallway Display', dur: 150, size: 263, imgs: 75, type: 'hallway' },
    ];
    const typeTags = {
      county: '<span class="tag tag-county">County</span>',
      sector: '<span class="tag tag-sector">Sector</span>',
      hero: '<span class="tag tag-hero">Hero</span>',
      hallway: '<span class="tag tag-hallway">Hallway</span>',
    };
    const grid = document.getElementById('video-grid');
    screens.forEach(s => {
      const fn = `auto_${s.id}.mp4`;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${s.label} ${typeTags[s.type] || ''}</h3>
        <div class="screen-id">${fn}</div>
        <div class="meta">
          <span>⏱ ${s.dur}s</span>
          <span>💾 ${s.size} MB</span>
          <span>🖼 ${s.imgs} images</span>
        </div>
        <a class="play-btn" href="${fn}" target="_blank">▶ Play Video</a>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
