name: kicc_public
description: KICC Tourism Marketplace — Public Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  flutter_stripe: ^10.0.0
  webview_flutter: ^4.5.0
  share_plus: ^7.2.0
  local_notifications: ^0.0.1
  google_maps_flutter: ^2.5.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/