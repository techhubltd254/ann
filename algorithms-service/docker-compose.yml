# Production deployment: KICC Algorithms Python Microservice
# App:     Python algorithms (all 20, stateless, scale horizontally)
# Comm:    Laravel → Python via HTTP (port 8400)
# State:   TiDB (shared with Laravel) + Redis streams for events
services:
  kicc-api:
    build:
      context: ..
      dockerfile: algorithms-service/Dockerfile
    environment:
      - KICC_CONFIG_OVERRIDES={"pool":{"alpha":0.7,"beta":0.3}}
      - KICC_API_PORT=8400
    ports:
      - "8400:8400"
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "2"
          memory: 1G
