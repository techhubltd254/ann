<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360° Experience — KICC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0b0b0b}
  #pano{width:100%;height:100vh}
  .hud{position:fixed;top:16px;left:16px;z-index:10;color:#fff;font-family:Inter,system-ui,sans-serif}
  .hud b{color:#FFCD05}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font:12px Inter,sans-serif;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:999px}
</style>
</head>
<body>
<div class="hud"><b>KICC</b> · 360° Experience</div>
<div id="pano"></div>
<div class="hint">Drag to look around · scroll to zoom</div>
<script>
// Tier B (blueprint §7): 360° spherical viewer. Supply an equirectangular image
// via ?img=/path/to/pano.jpg (2:1). Until county 360° captures land, we render
// a depth-aware stand-in so the viewer is production-wired and testable.
const params = new URLSearchParams(location.search);
const img = params.get('img');
if (img) {
  pannellum.viewer('pano', {
    type: 'equirectangular', panorama: img, autoLoad: true,
    autoRotate: -2, compass: false, showControls: true,
  });
} else {
  document.getElementById('pano').innerHTML =
    '<div style="color:#fff;display:flex;height:100vh;align-items:center;justify-content:center;text-align:center;font-family:Inter,sans-serif;padding:2rem">' +
    '<div><div style="font-size:3rem">🌐</div><h2>360° experience coming to this county</h2>' +
    '<p style="color:rgba(255,255,255,.6)">County 360° captures are being produced. Pass ?img=&lt;equirectangular-url&gt; to preview any capture.</p></div></div>';
}
</script>
</body>
</html>
