<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Kenya Terrain Explorer — KICC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a12; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
        #back-link {
            position: fixed; top: 16px; left: 16px; z-index: 200;
            color: rgba(255,255,255,0.5); font-size: 13px; text-decoration: none;
            background: rgba(0,0,0,0.55); padding: 6px 14px; border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        #back-link:hover { color: #FFCD05; }
        #hint {
            position: fixed; top: 16px; right: 16px; z-index: 200;
            color: rgba(255,255,255,0.45); font-size: 12px;
            font-family: monospace; text-transform: uppercase; letter-spacing: 0.06em;
            background: rgba(0,0,0,0.55); padding: 6px 14px; border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        .waypoint-label {
            color: #fff; font-size: 11px; font-weight: 700;
            background: rgba(179,38,30,0.85); padding: 4px 10px;
            border-radius: 12px; font-family: 'Inter', system-ui, sans-serif;
            white-space: nowrap; pointer-events: auto;
            cursor: pointer; transition: background 0.2s;
            letter-spacing: 0.03em;
        }
        .waypoint-label:hover { background: #FFCD05; color: #0a0a12; }
        .coord-box {
            position: fixed; bottom: 20px; left: 20px; z-index: 200;
            color: rgba(255,255,255,0.4); font-size: 11px; font-family: monospace;
            background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 10px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <a id="back-link" href="/">← Back to Home</a>
    <div id="hint">Drag to explore terrain · Scroll to zoom</div>
    <div class="coord-box" id="coord-box">lat 0.0° lon 37.0° alt 3.2km</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const W = window.innerWidth;
    const H = window.innerHeight;
    const DPR = Math.min(window.devicePixelRatio, 2);

    // ── Scene ──
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.FogExp2(0x0a0a14, 0.00018);

    const camera = new THREE.PerspectiveCamera(50, W / H, 0.5, 120);
    camera.position.set(8, 7, 12);

    // ── Renderers ──
    const glRenderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    glRenderer.setSize(W, H);
    glRenderer.setPixelRatio(DPR);
    glRenderer.shadowMap.enabled = true;
    glRenderer.outputColorSpace = THREE.SRGBColorSpace;
    glRenderer.toneMapping = THREE.ACESFilmicToneMapping;
    glRenderer.toneMappingExposure = 1.1;
    document.body.appendChild(glRenderer.domElement);

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(W, H);
    labelRenderer.domElement.style.position = 'fixed';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    // ── Orbit Controls ──
    const controls = new OrbitControls(camera, glRenderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableZoom = true;
    controls.minDistance = 4;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.target.set(0, 0, 0);
    controls.update();

    // ── Lighting ──
    scene.add(new THREE.AmbientLight(0x334466, 0.5));
    const sun = new THREE.DirectionalLight(0xffeedd, 3.5);
    sun.position.set(10, 15, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 60;
    sun.shadow.camera.left = -20;
    sun.shadow.camera.right = 20;
    sun.shadow.camera.top = 20;
    sun.shadow.camera.bottom = -20;
    sun.shadow.bias = -0.0001;
    scene.add(sun);

    // ── Procedural Terrain ──
    const TERRAIN_SIZE = 16;
    const TERRAIN_SEGMENTS = 200;
    const HEIGHT_SCALE = 2.5;

    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.createImageData(1024, 1024);

    // Procedural terrain texture (satellite-style)
    for (let y = 0; y < 1024; y++) {
        for (let x = 0; x < 1024; x++) {
            const i = (y * 1024 + x) * 4;
            const h = simplexNoise(x / 512, y / 512) * 0.5 + 0.5;
            const r = Math.floor(30 + h * 60);
            const g = Math.floor(30 + h * 70);
            const b = Math.floor(20 + h * 35);
            imageData.data[i] = r;
            imageData.data[i + 1] = g;
            imageData.data[i + 2] = b;
            imageData.data[i + 3] = 255;
        }
    }
    ctx.putImageData(imageData, 0, 0);

    const terrainTex = new THREE.CanvasTexture(canvas);
    terrainTex.colorSpace = THREE.SRGBColorSpace;
    terrainTex.wrapS = THREE.RepeatWrapping;
    terrainTex.wrapT = THREE.RepeatWrapping;
    terrainTex.repeat.set(3, 3);

    const terrainGeom = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
    terrainGeom.rotateX(-Math.PI / 2);

    const positions = terrainGeom.attributes.position.array;
    for (let i = 0; i < positions.length; i += 3) {
        const x = positions[i];
        const z = positions[i + 2];
        const ux = (x / TERRAIN_SIZE) * 0.5 + 0.5;
        const uz = (z / TERRAIN_SIZE) * 0.5 + 0.5;

        // Multi-octave noise for realistic terrain
        let h = 0;
        h += simplexNoise(ux * 4.5, uz * 4.5) * 0.6;
        h += simplexNoise(ux * 8.0, uz * 8.0) * 0.25;
        h += simplexNoise(ux * 16.0, uz * 16.0) * 0.12;
        h += simplexNoise(ux * 32.0, uz * 32.0) * 0.06;
        positions[i + 1] = h * HEIGHT_SCALE;
    }
    terrainGeom.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
        map: terrainTex,
        roughness: 0.85,
        metalness: 0.05,
        flatShading: false,
    });

    const terrain = new THREE.Mesh(terrainGeom, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // ── Volumetric Cloud Layers ──
    const cloudGroup = new THREE.Group();
    for (let i = 0; i < 5; i++) {
        const cloudPlane = new THREE.PlaneGeometry(TERRAIN_SIZE * 1.4, TERRAIN_SIZE * 1.4);
        const cloudMat = new THREE.ShaderMaterial({
            vertexShader: /* glsl */ `
                varying vec2 vUv;
                void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
            `,
            fragmentShader: /* glsl */ `
                varying vec2 vUv;
                uniform float uTime;
                uniform float uIndex;
                float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
                float noise(vec2 p) {
                    vec2 i = floor(p), f = fract(p);
                    f = f * f * (3.0 - 2.0 * f);
                    return mix(mix(hash(i), hash(i + vec2(1,0)), f.x),
                               mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
                }
                void main() {
                    vec2 uv = vUv * 4.0 + uIndex * 3.7 + uTime * 0.03;
                    float n = noise(uv) * 0.5 + noise(uv * 2.1) * 0.3 + noise(uv * 4.7) * 0.2;
                    float alpha = smoothstep(0.38, 0.58, n) * 0.25;
                    gl_FragColor = vec4(1.0, 1.0, 1.0, alpha);
                }
            `,
            uniforms: {
                uTime: { value: 0 },
                uIndex: { value: i },
            },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        const cloud = new THREE.Mesh(cloudPlane, cloudMat);
        cloud.rotation.x = -Math.PI / 2;
        cloud.position.y = 3.0 + i * 1.2;
        cloud.renderOrder = i;
        cloudGroup.add(cloud);
        cloudGroup._clouds = cloudGroup._clouds || [];
        cloudGroup._clouds.push(cloud);
    }
    scene.add(cloudGroup);

    // ── Waypoints ──
    const waypoints = [
        { name: 'Nairobi', lat: -1.2921, lon: 36.8219, desc: 'Capital & KICC' },
        { name: 'Mombasa', lat: -4.0435, lon: 39.6682, desc: 'Coastal Hub' },
        { name: 'Kisumu', lat: -0.0917, lon: 34.7680, desc: 'Lakeside City' },
        { name: 'Nakuru', lat: -0.3031, lon: 36.0800, desc: 'Lake Nakuru' },
        { name: 'Eldoret', lat: 0.5143, lon: 35.2698, desc: 'Highland Region' },
        { name: 'Lamu', lat: -2.2696, lon: 40.9006, desc: 'Heritage Island' },
        { name: 'Marsabit', lat: 2.3280, lon: 37.9900, desc: 'Northern Frontier' },
        { name: 'Garissa', lat: -0.4532, lon: 39.6400, desc: 'Eastern Gateway' },
    ];

    function latLonToWorld(lat, lon) {
        const x = ((lon - 36.5) / 6.5) * TERRAIN_SIZE * 0.45;
        const z = ((lat + 0.5) / 4.5) * TERRAIN_SIZE * 0.45;

        // Sample terrain height at this position
        const ux = (x / TERRAIN_SIZE) * 0.5 + 0.5;
        const uz = (z / TERRAIN_SIZE) * 0.5 + 0.5;
        let h = 0;
        h += simplexNoise(ux * 4.5, uz * 4.5) * 0.6;
        h += simplexNoise(ux * 8.0, uz * 8.0) * 0.25;
        h += simplexNoise(ux * 16.0, uz * 16.0) * 0.12;
        const y = h * HEIGHT_SCALE + 0.25;

        return new THREE.Vector3(x, y, z);
    }

    waypoints.forEach((wp) => {
        const worldPos = latLonToWorld(wp.lat, wp.lon);
        const el = document.createElement('div');
        el.className = 'waypoint-label';
        el.textContent = wp.name;
        el.title = wp.desc;
        el.addEventListener('click', () => flyTo(worldPos));
        const label = new CSS2DObject(el);
        label.position.copy(worldPos);
        label.position.y += 0.35;
        scene.add(label);

        // Pin dot
        const dotGeom = new THREE.SphereGeometry(0.06, 8, 8);
        const dotMat = new THREE.MeshBasicMaterial({ color: 0xFFCD05 });
        const dot = new THREE.Mesh(dotGeom, dotMat);
        dot.position.copy(worldPos);
        dot.position.y += 0.08;
        scene.add(dot);

        // Pulse ring
        const ringGeom = new THREE.TorusGeometry(0.15, 0.015, 8, 16);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xFFCD05, transparent: true, opacity: 0.5 });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.position.copy(worldPos);
        ring.position.y += 0.08;
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        if (!scene._waypoints) scene._waypoints = [];
        scene._waypoints.push({ dot, ring, worldPos });
    });

    // ── Fly-to function ──
    function flyTo(target) {
        const startPos = camera.position.clone();
        const startTarget = controls.target.clone();
        const endPos = new THREE.Vector3(
            target.x + 2.0,
            target.y + 3.5,
            target.z + 3.0
        );
        const endTarget = target.clone();

        const startTime = performance.now();
        const duration = 1200;

        function animateFly(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1.0);
            const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

            camera.position.lerpVectors(startPos, endPos, ease);
            controls.target.lerpVectors(startTarget, endTarget, ease);
            controls.update();

            if (t < 1) {
                requestAnimationFrame(animateFly);
            }
        }
        requestAnimationFrame(animateFly);
    }

    // ── Coordinates display ──
    const coordBox = document.getElementById('coord-box');
    let coordTimer = 0;

    // ── Render loop ──
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.1);
        const elapsed = performance.now() * 0.001;
        controls.update();

        // Update cloud shader uniforms
        if (cloudGroup._clouds) {
            cloudGroup._clouds.forEach((c) => {
                if (c.material.uniforms) {
                    c.material.uniforms.uTime.value = elapsed;
                }
            });
        }

        // Pulse waypoint rings
        if (scene._waypoints) {
            scene._waypoints.forEach((w, i) => {
                const scale = 1 + Math.sin(elapsed * 3 + i) * 0.2;
                w.ring.scale.set(scale, scale, scale);
                w.ring.material.opacity = 0.3 + Math.sin(elapsed * 3 + i) * 0.2;
            });
        }

        coordTimer += dt;
        if (coordTimer > 0.25) {
            coordTimer = 0;
            const cx = controls.target.x;
            const cz = controls.target.z;
            const cy = controls.target.y;
            const approxLat = (cz / (TERRAIN_SIZE * 0.45)) * 4.5 - 0.5;
            const approxLon = (cx / (TERRAIN_SIZE * 0.45)) * 6.5 + 36.5;
            coordBox.textContent =
                `lat ${approxLat.toFixed(1)}° lon ${approxLon.toFixed(1)}° alt ${(cy + 3.2).toFixed(1)}km`;
        }

        glRenderer.render(scene, camera);
        labelRenderer.render(scene, camera);
    }

    animate();

    // ── Resize ──
    window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        glRenderer.setSize(w, h);
        labelRenderer.setSize(w, h);
    });

    // ── Simplex noise (inline for zero-dependency terrain) ──
    function simplexNoise(x, y) {
        const F2 = 0.5 * (Math.sqrt(3.0) - 1.0);
        const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;

        const s = (x + y) * F2;
        const i = Math.floor(x + s);
        const j = Math.floor(y + s);
        const t = (i + j) * G2;
        const X0 = i - t;
        const Y0 = j - t;
        const x0 = x - X0;
        const y0 = y - Y0;

        let i1, j1;
        if (x0 > y0) { i1 = 1; j1 = 0; }
        else { i1 = 0; j1 = 1; }

        const x1 = x0 - i1 + G2;
        const y1 = y0 - j1 + G2;
        const x2 = x0 - 1.0 + 2.0 * G2;
        const y2 = y0 - 1.0 + 2.0 * G2;

        const ii = i & 255;
        const jj = j & 255;

        const perm = new Uint8Array([
            151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,
            8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,
            35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,
            134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,
            55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,
            18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,
            250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,
            189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,
            172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,
            228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,
            107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,
            138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180
        ]);

        function grad(hashVal, x, y) {
            const h = hashVal & 3;
            const u = h < 2 ? x : -x;
            const v = h < 2 ? y : -y;
            return (h & 1 ? u + v : u - v) * (hashVal / 255.0 * 0.7 + 0.3);
        }

        const gi0 = perm[ii + perm[jj]] % 255;
        const gi1 = perm[ii + i1 + perm[jj + j1]] % 255;
        const gi2 = perm[ii + 1 + perm[jj + 1]] % 255;

        let n0 = 0, n1 = 0, n2 = 0;
        const t0 = 0.5 - x0 * x0 - y0 * y0;
        if (t0 >= 0) { const d = t0 * t0; n0 = d * d * grad(gi0, x0, y0); }
        const t1 = 0.5 - x1 * x1 - y1 * y1;
        if (t1 >= 0) { const d = t1 * t1; n1 = d * d * grad(gi1, x1, y1); }
        const t2 = 0.5 - x2 * x2 - y2 * y2;
        if (t2 >= 0) { const d = t2 * t2; n2 = d * d * grad(gi2, x2, y2); }

        return 70.0 * (n0 + n1 + n2);
    }
    </script>
</body>
</html>
