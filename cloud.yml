id: kicc
region: eu-central-1
database: false

# Laravel Cloud build for the `main` branch.
# Production runs on the droplet (origin.kicctest.org); this pipeline is
# the staging/preview twin. The database config uses TIDB_* env vars
# exclusively so Laravel Cloud's injected DB_* vars are harmless
# (config/database.php no longer reads DB_URL/DB_HOST for app connections).
#
# ⚠ REQUIRED — set these in Laravel Cloud dashboard
# (Settings → Environment Variables). Without them the deployed app falls
# back to the hardcoded TiDB creds in config/database.php, which works,
# but the platform's injected DB_CONNECTION=mysql must never win.
#   DB_CONNECTION = tidb
#   TIDB_HOST     = gateway01.eu-central-1.prod.aws.tidbcloud.com
#   TIDB_PORT     = 4000
#   TIDB_DATABASE = kicc
#   TIDB_USERNAME = 28dbcDfwh5hEbSc.root
#   TIDB_PASSWORD = D8trCZaYhqZWo5Vq
#   MYSQL_ATTR_SSL_CA = /etc/ssl/certs/ca-certificates.crt
#   DB_SSL_VERIFY     = false
#
# Verify after deploy: open https://<app-domain>/db-check — it must report
# "is_tidb": true with counties: 47 (and the other live table counts).
build:
  - mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
  - composer install --no-dev --no-interaction --optimize-autoloader --prefer-dist

deploy:
  - php artisan storage:link --force || true
  - php artisan config:clear || true
  - php artisan config:cache || true
  - php artisan migrate --force --database=tidb 2>&1 || echo "migrate exit: $?"
  - php artisan db:seed --class=MurangaAccurateDataSeeder --force --database=tidb 2>&1 || echo "seed exit: $?"

environments:
  production:
    domain: kicctest.org
  preview:
    domain: '{default}'