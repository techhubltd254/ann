id: kicc
region: eu-central-1
database: false

# Laravel Cloud build for the `main` branch (Laravel app at repo root).
# Production runs on the droplet; this pipeline is the staging/preview twin.
build:
  - mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
  - composer install --no-dev --no-interaction --optimize-autoloader --prefer-source
  - php artisan config:clear || true
  - php artisan config:cache || true

deploy:
  - php artisan storage:link --force || true
  - php artisan migrate --force 2>&1 || echo "migrate exit: $?"

environments:
  production:
    domain: kicctest.org
  preview:
    domain: '{default}'
