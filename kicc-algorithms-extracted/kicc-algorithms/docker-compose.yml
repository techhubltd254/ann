# Horizontal scale: the algorithm layer is STATELESS per request
# (config + ports injected); durable state lives in the DB + Redis below.
# Scale: docker compose up --scale kicc-algorithms=16
services:
  kicc-algorithms:
    build: .
    environment:
      - KICC_CONFIG_OVERRIDES={"pool":{"alpha":0.7,"beta":0.3}}
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "2"
          memory: 1G
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kicc
      POSTGRES_USER: kicc
      POSTGRES_PASSWORD: kicc_dev_only
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
